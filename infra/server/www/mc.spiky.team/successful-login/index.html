<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>SpikyMC — Successful Login</title>
<style>
  :root {
    --bg: #0A0E0B;
    --surface: #131914;
    --surface-alt: #182019;
    --border: #2F3E30;
    --border-strong: #415342;
    --text: #F1F7EF;
    --text-secondary: #BCCABB;
    --text-muted: #859587;
    --accent: #52A535;
    --accent-hover: #62B741;
    --on-accent: #081007;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(620px 420px at 50% -10%, rgba(82, 165, 53, .16), transparent 70%),
      radial-gradient(420px 320px at 50% 110%, rgba(82, 165, 53, .07), transparent 70%);
    pointer-events: none;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px 32px;
    text-align: center;
  }
  .logo { width: 72px; height: 72px; margin: 0 auto 22px; display: block; }
  .badge {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 6px rgba(82, 165, 53, .12);
    animation: pop .45s cubic-bezier(.2, 1.3, .4, 1) both;
  }
  .badge svg { width: 34px; height: 34px; }
  .badge svg path {
    stroke: var(--on-accent);
    stroke-dasharray: 32;
    stroke-dashoffset: 32;
    animation: draw .35s .28s ease-out forwards;
  }
  h1 {
    font-size: 1.65rem;
    font-weight: 700;
    letter-spacing: -.2px;
    margin-bottom: 10px;
  }
  p {
    color: var(--text-secondary);
    font-size: .98rem;
    line-height: 1.6;
  }
  .hint {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: .84rem;
    line-height: 1.55;
  }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .badge, .badge svg path { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>

  <h1>Login Successful</h1>
  <p>You have successfully logged in to SpikyMC with your Microsoft account.</p>

  <p class="hint">You can close this tab &mdash; the launcher will continue on its own.</p>

</html>
